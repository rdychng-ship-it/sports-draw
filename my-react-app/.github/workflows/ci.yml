name: CI

# Run on every push to main, and on every pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # Get the code
      - uses: actions/checkout@v4

      # Install Node, and cache npm downloads between runs
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Install exactly what's in package-lock.json
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build